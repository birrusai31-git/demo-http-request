name: CI - Build and Test

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Configure Maven settings
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>anypoint-exchange-v3</id>
              <username>\${env.ANYPOINT_USERNAME}</username>
              <password>\${env.ANYPOINT_PASSWORD}</password>
            </server>
            <server>
              <id>mule-enterprise</id>
              <username>\${env.ANYPOINT_USERNAME}</username>
              <password>\${env.ANYPOINT_PASSWORD}</password>
            </server>
          </servers>
        </settings>
        EOF
      env:
        ANYPOINT_USERNAME: ${{ secrets.ANYPOINT_USERNAME }}
        ANYPOINT_PASSWORD: ${{ secrets.ANYPOINT_PASSWORD }}
        
    - name: Compile project
      run: mvn clean compile
      
    - name: Run tests
      run: mvn test
      
    - name: Package application
      run: mvn package
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: mule-application
        path: target/*.jar
        retention-days: 30
        
    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: MUnit Test Results
        path: target/surefire-reports/*.xml
        reporter: java-junit
        
    - name: SonarQube analysis (optional)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
          mvn sonar:sonar -Dsonar.projectKey=demo-http-request -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}