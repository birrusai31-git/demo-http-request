name: CD - Deploy to CloudHub

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - test
        - prod
      app_name:
        description: 'Application name (optional)'
        required: false
        type: string

env:
  MAVEN_OPTS: -Xmx1024m

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Configure Maven settings
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>anypoint-exchange-v3</id>
              <username>\${env.ANYPOINT_USERNAME}</username>
              <password>\${env.ANYPOINT_PASSWORD}</password>
            </server>
            <server>
              <id>mule-enterprise</id>
              <username>\${env.ANYPOINT_USERNAME}</username>
              <password>\${env.ANYPOINT_PASSWORD}</password>
            </server>
          </servers>
        </settings>
        EOF
      env:
        ANYPOINT_USERNAME: ${{ secrets.ANYPOINT_USERNAME }}
        ANYPOINT_PASSWORD: ${{ secrets.ANYPOINT_PASSWORD }}
        
    - name: Set deployment variables
      run: |
        ENV="${{ github.event.inputs.environment || 'dev' }}"
        APP_NAME="${{ github.event.inputs.app_name || 'demo-http-request' }}"
        
        case $ENV in
          dev)
            echo "CLOUDHUB_ENV=Development" >> $GITHUB_ENV
            echo "CLOUDHUB_REGION=us-east-1" >> $GITHUB_ENV
            echo "CLOUDHUB_WORKERS=1" >> $GITHUB_ENV
            echo "CLOUDHUB_WORKER_TYPE=MICRO" >> $GITHUB_ENV
            ;;
          test)
            echo "CLOUDHUB_ENV=Test" >> $GITHUB_ENV
            echo "CLOUDHUB_REGION=us-east-1" >> $GITHUB_ENV
            echo "CLOUDHUB_WORKERS=1" >> $GITHUB_ENV
            echo "CLOUDHUB_WORKER_TYPE=SMALL" >> $GITHUB_ENV
            ;;
          prod)
            echo "CLOUDHUB_ENV=Production" >> $GITHUB_ENV
            echo "CLOUDHUB_REGION=us-east-1" >> $GITHUB_ENV
            echo "CLOUDHUB_WORKERS=2" >> $GITHUB_ENV
            echo "CLOUDHUB_WORKER_TYPE=MEDIUM" >> $GITHUB_ENV
            ;;
        esac
        
        echo "APP_NAME=${APP_NAME}-${ENV}" >> $GITHUB_ENV
        echo "DEPLOY_ENV=${ENV}" >> $GITHUB_ENV
        
    - name: Build application
      run: mvn clean package -DskipTests
      
    - name: Deploy to CloudHub 2.0
      run: |
        mvn deploy -DmuleDeploy \
          -Dcloudhub2.username="${{ secrets.ANYPOINT_USERNAME }}" \
          -Dcloudhub2.password="${{ secrets.ANYPOINT_PASSWORD }}" \
          -Dcloudhub2.environment="$CLOUDHUB_ENV" \
          -Dcloudhub2.target="CloudHub-US-East-NorthVirginia" \
          -Dcloudhub2.applicationName="$APP_NAME" \
          -Dcloudhub2.replicas="$CLOUDHUB_WORKERS" \
          -Dcloudhub2.vCores="$CLOUDHUB_WORKER_TYPE" \
          -Dcloudhub2.businessGroup="${{ secrets.ANYPOINT_BUSINESS_GROUP }}" \
          -DskipTests
          
    - name: Verify deployment
      run: |
        echo "Application deployed successfully!"
        echo "Environment: $DEPLOY_ENV"
        echo "Application Name: $APP_NAME"
        echo "CloudHub Environment: $CLOUDHUB_ENV"
        
    - name: Create deployment summary
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        # 🚀 Deployment Summary
        
        ## Application Details
        - **Application Name**: $APP_NAME
        - **Environment**: $DEPLOY_ENV
        - **CloudHub Environment**: $CLOUDHUB_ENV
        - **Workers**: $CLOUDHUB_WORKERS
        - **Worker Type**: $CLOUDHUB_WORKER_TYPE
        - **Region**: $CLOUDHUB_REGION
        - **Commit SHA**: ${{ github.sha }}
        - **Deployed by**: ${{ github.actor }}
        
        ## Next Steps
        1. Monitor application logs in Anypoint Platform
        2. Run smoke tests against the deployed application
        3. Update API documentation if needed
        EOF
        
    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment completed successfully"
        else
          echo "❌ Deployment failed"
          exit 1
        fi